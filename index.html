<!-- Firebase Modules -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { 
    getDatabase, 
    ref, 
    push, 
    get 
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCsJhDKV9N9wN7hL1ieMUjI8h8SIgEYIfI",
    authDomain: "minimy-52b92.firebaseapp.com",
    databaseURL: "https://minimy-52b92-default-rtdb.firebaseio.com",
    projectId: "minimy-52b92",
    storageBucket: "minimy-52b92.appspot.com",
    messagingSenderId: "1008825830443",
    appId: "1:1008825830443:web:eb934d24ac6e2c98122e6e"
  };

  const staffPins = {
    "Mahmoud": "4821",
    "Emily": "1934",
    "Kevin AAA cleaner": "6666",
    "Kumar": "8642",
    "Jian": "7419",
    "AVA": "2356",
    "Amir": "9184",
    "Urvashi": "6631",
    "Noah": "5027",
    "Mohie": "7744",
    "Lara": "1208",
    "Katrina": "8841",
    "Ting": "3395",
    "Arjun": "4520",
    "Sophia": "6712",
    "Random": "9999"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  document.getElementById('trackerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const staffName = document.getElementById('staffName').value;
    const staffPin = document.getElementById('staffPin').value;
    const deviceId = document.getElementById('deviceId').value;
    const action = document.getElementById('action').value;

    // 1. PIN Authentication Check
    if (staffPins[staffName] !== staffPin) {
      statusEl.style.color = 'var(--error)';
      statusEl.innerText = '✕ Incorrect PIN';
      return;
    }

    // Disable button during network lookups to prevent double taps
    submitBtn.disabled = true;
    statusEl.style.color = 'var(--text-muted)';
    statusEl.innerText = 'Verifying device status...';

    try {
      // 2. Fetch all logs and filter in browser
      const logsRef = ref(database, 'logs');
      const snapshot = await get(logsRef);

      let lastAction = null;
      let lastUser = null;

      if (snapshot.exists()) {
        const allLogs = snapshot.val();
        
        // Filter out logs only matching this device ID, then sort chronologically
        const deviceLogs = Object.values(allLogs)
          .filter(log => log.deviceId === deviceId)
          .sort((a, b) => new Date(a.time) - new Date(b.time));

        if (deviceLogs.length > 0) {
          const latestRecord = deviceLogs[deviceLogs.length - 1];
          lastAction = latestRecord.action;
          lastUser = latestRecord.staffName;
        }
      }

      // 3. Validation Rules with Named Attribution
      if (action === 'Returned' && lastAction !== 'Checked Out') {
        statusEl.style.color = 'var(--error)';
        statusEl.innerText = `✕ Cannot return. ${deviceId} is not currently checked out.`;
        submitBtn.disabled = false;
        return;
      }

      if (action === 'Checked Out' && lastAction === 'Checked Out') {
        statusEl.style.color = 'var(--error)';
        // Shows exactly who has the device currently
        statusEl.innerText = `✕ ${deviceId} is already Checked Out by ${lastUser || 'someone'}.`;
        submitBtn.disabled = false;
        return;
      }

      // 4. Everything is valid -> Log the new transaction
      await push(ref(database, 'logs'), {
        staffName: staffName,
        deviceId: deviceId,
        action: action,
        time: new Date().toLocaleString()
      });

      statusEl.style.color = 'var(--success)';
      statusEl.innerText = '✓ Successfully Submitted';
      document.getElementById('trackerForm').reset();

    } catch (error) {
      statusEl.style.color = 'var(--error)';
      statusEl.innerText = '✕ Connection error. Try again.';
      console.error("Transaction Error: ", error);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
