  <label>Staff Name</label>
  <select id="staffName" required>

    <option>Emily</option>
    <option>Kevin</option>

  <label>Action</label>
  <select id="action" required>

    <option>Checked Out</option>

  </select>

  <button type="submit">Submit</button>

</form>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
  getDatabase,
  ref,
  push
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';


const firebaseConfig = {
  apiKey: "AIzaSyCsJhDKV9N9wN7hL1ieMUjI8h8SIgEYIfI",
  authDomain: "minimy-52b92.firebaseapp.com",
  databaseURL: "https://minimy-52b92-default-rtdb.firebaseio.com",
  projectId: "minimy-52b92",

  messagingSenderId: "1008825830443",
  appId: "1:1008825830443:web:eb934d24ac6e2c98122e6e"
};


const staffPins = {
  "Mahmoud": "4821",
  "Emily": "1934",
  "Kevin": "5572",
  "Kumar": "8642",
  "Jian": "7419",
  "AVA": "2356",
  "Amir": "9184",
  "Urvashi": "6631",
  "Noah": "5027",
  "Mohie": "7744",
  "Lara": "1208",
  "Katrina": "8841",
  "Ting": "3395",
  "Arjun": "4520",
  "Sophia": "6712",
  "Random": "9999"
};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

document.getElementById('trackerForm').addEventListener('submit', function(e) {

  e.preventDefault();

  const staffName = document.getElementById('staffName').value;
  const staffPin = document.getElementById('staffPin').value;
  const deviceId = document.getElementById('deviceId').value;
  const action = document.getElementById('action').value;

  if (staffPins[staffName] !== staffPin) {

    document.getElementById('status').style.color = 'red';
    document.getElementById('status').innerText = 'Incorrect PIN';

    return;
  }

  push(ref(database, 'logs'), {
    staffName: staffName,
    deviceId: deviceId,
    action: action,
    time: new Date().toLocaleString()
  });

  document.getElementById('status').style.color = 'green';
  document.getElementById('status').innerText =
    'Successfully Submitted';

  document.getElementById('trackerForm').reset();

});

</script>
